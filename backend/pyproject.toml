[project]
name = "evm-project-tracker-backend"
version = "0.1.0"
description = "API REST para seguimiento de proyectos y cálculo de indicadores de Valor Ganado (EVM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errores)
    "W",   # pycodestyle (warnings)
    "F",   # pyflakes (imports/variables sin uso, etc.)
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna)
    "B",   # flake8-bugbear (errores comunes/bugs sutiles)
    "SIM", # flake8-simplify (simplificación de lógica)
    "N",   # pep8-naming
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa `Depends(...)` como valor por defecto de parámetro por diseño
# (es la forma en que declara la inyección de dependencias); no es el patrón
# de "mutable default argument" que B008 busca prevenir.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app.services --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app.services"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
