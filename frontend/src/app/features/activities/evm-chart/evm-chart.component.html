@if (!hasActivities) {
  <div
    class="rounded-lg border border-dashed border-slate-300 bg-white px-4 py-8 text-center text-sm text-slate-600"
  >
    No hay actividades para graficar. Agrega al menos una para comparar PV, EV y AC.
  </div>
} @else {
  <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
    @if (isTruncated) {
      <p class="m-0 mb-3 text-sm text-slate-600">
        Mostrando {{ shownCount }} de {{ totalCount }} (mayor
        <span class="font-semibold">|CV|</span>).
        La tabla y el consolidado muestran el proyecto completo.
      </p>
    }
    <div class="relative h-80 w-full">
      <canvas #chartCanvas aria-label="Gráfica de PV, EV y AC por actividad"></canvas>
    </div>
  </div>
}
