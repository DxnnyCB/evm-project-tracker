@if (open) {
  <div
    class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4"
    role="presentation"
    (click)="onBackdropClick()"
  >
    <div
      class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-5 shadow-lg"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-dialog-title'"
      [attr.aria-describedby]="'confirm-dialog-message'"
      (click)="$event.stopPropagation()"
    >
      <h2
        id="confirm-dialog-title"
        class="m-0 mb-2 text-lg font-semibold text-slate-900"
      >
        {{ title }}
      </h2>
      <p
        id="confirm-dialog-message"
        class="m-0 mb-5 whitespace-pre-line text-sm leading-relaxed text-slate-600"
      >
        {{ message }}
      </p>
      <div class="flex flex-wrap justify-end gap-2">
        <button
          type="button"
          class="cursor-pointer rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
          (click)="onCancel()"
        >
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          class="cursor-pointer rounded-md border px-4 py-2 text-sm font-semibold text-white"
          [ngClass]="
            tone === 'danger'
              ? 'border-red-800 bg-red-700 hover:bg-red-800'
              : 'border-slate-800 bg-slate-700 hover:bg-slate-800'
          "
          (click)="onConfirm()"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
