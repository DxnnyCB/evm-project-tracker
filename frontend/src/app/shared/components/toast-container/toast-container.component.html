<div
  class="pointer-events-none fixed right-4 top-4 z-50 flex w-[min(100%-2rem,22rem)] flex-col gap-2"
  aria-live="polite"
  aria-relevant="additions"
>
  @for (toast of toastService.toasts$ | async; track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border px-4 py-3 text-sm shadow-md"
      role="status"
      [ngClass]="
        toast.variant === 'success'
          ? 'border-emerald-200 bg-emerald-50 text-emerald-900'
          : 'border-red-200 bg-red-50 text-red-900'
      "
    >
      <p class="m-0 min-w-0 flex-1 leading-snug">{{ toast.message }}</p>
      <button
        type="button"
        class="shrink-0 cursor-pointer border-0 bg-transparent p-0 text-base leading-none opacity-70 hover:opacity-100"
        [attr.aria-label]="'Cerrar notificación'"
        (click)="toastService.dismiss(toast.id)"
      >
        ×
      </button>
    </div>
  }
</div>
